; ESP32-S3 串口<->WiFi 透传桥 PlatformIO 工程配置
; 用法：VS Code 安装 PlatformIO IDE 扩展 → 单独打开 esp32s3_bridge 这个文件夹
;       → 底部状态栏 ✓(Build) 编译、→(Upload) 烧录、插头图标看串口日志
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Serial 调试口走原生 USB（多数 S3 最小系统板只有一个 Type-C 且直连
    ; USB 外设，不加这条看不到 [桥] 日志）。若你的板子 USB 口经
    ; CH340/CP2102 转串口（板上有额外一颗串口芯片），删掉下面这行。
    -DARDUINO_USB_CDC_ON_BOOT=1
